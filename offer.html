<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Random Phrase</title>

  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(13, 18, 27, 0.82);
      --cyan: #00eaff;
      --blue: #277cff;
      --text: #f3f8ff;
      --muted: #6e7c91;
      --line: rgba(0, 234, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Futuristic ambient glow */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 42vw;
      height: 42vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
    }

    body::before {
      background: #00eaff;
      top: -22vw;
      left: -15vw;
    }

    body::after {
      background: #365cff;
      bottom: -25vw;
      right: -15vw;
    }

    .app {
      width: min(900px, 100%);
      min-height: min(700px, calc(100dvh - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 46px;
      position: relative;
      z-index: 1;
    }

    .phrase {
      width: 100%;
      max-width: 850px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(28px, 5vw, 62px);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
      padding: 24px;
      text-shadow:
        0 0 18px rgba(0, 234, 255, 0.12);
    }

    .button {
      position: relative;
      min-width: 150px;
      padding: 16px 42px;
      border: 1px solid rgba(0, 234, 255, 0.65);
      border-radius: 12px;
      background:
        linear-gradient(
          180deg,
          rgba(0, 234, 255, 0.18),
          rgba(39, 124, 255, 0.12)
        );
      color: var(--cyan);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 0 18px rgba(0, 234, 255, 0.18),
        0 0 45px rgba(0, 119, 255, 0.08),
        inset 0 0 18px rgba(0, 234, 255, 0.06);
      transition:
        transform 0.12s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
      touch-action: manipulation;
    }

    .button::before {
      content: "";
      position: absolute;
      left: -20%;
      top: 0;
      width: 35%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.22),
        transparent
      );
      transform: skewX(-20deg);
      animation: button-scan 3.2s infinite;
      pointer-events: none;
    }

    @keyframes button-scan {
      0%, 55% {
        left: -40%;
      }
      100% {
        left: 120%;
      }
    }

    .button:hover {
      color: #ffffff;
      background:
        linear-gradient(
          180deg,
          rgba(0, 234, 255, 0.25),
          rgba(39, 124, 255, 0.2)
        );
      box-shadow:
        0 0 22px rgba(0, 234, 255, 0.4),
        0 0 55px rgba(0, 119, 255, 0.15),
        inset 0 0 20px rgba(0, 234, 255, 0.1);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(3px) scale(0.985);
      box-shadow:
        0 0 8px rgba(0, 234, 255, 0.22),
        inset 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .button:disabled {
      opacity: 0.35;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .loading {
      width: min(360px, 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loading-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 234, 255, 0.12);
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 234, 255, 0.05);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      box-shadow:
        0 0 10px rgba(0, 234, 255, 0.8),
        0 0 25px rgba(0, 234, 255, 0.35);
      transition: width 0.08s linear;
    }

    .status {
      min-height: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .app {
        min-height: calc(100dvh - 32px);
        gap: 34px;
      }

      .phrase {
        min-height: 160px;
        padding: 16px 4px;
        font-size: clamp(27px, 8vw, 46px);
      }

      .button {
        min-width: 132px;
        padding: 15px 34px;
        border-radius: 11px;
        font-size: 19px;
      }

      .loading {
        width: min(300px, 82%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button::before {
        animation: none;
      }

      .button,
      .progress-bar {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="phrase" class="phrase">Initializing...</div>

    <div id="loading" class="loading">
      <div id="loadingLabel" class="loading-label">Scanning phrases</div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="status" class="status">0 / 99</div>
    </div>

    <button id="newPhrase" class="button" type="button" disabled>
      Next
    </button>
  </main>

  <script>
    const TOTAL_FILES = 99;

    const phraseElement = document.getElementById("phrase");
    const button = document.getElementById("newPhrase");
    const loading = document.getElementById("loading");
    const loadingLabel = document.getElementById("loadingLabel");
    const progressBar = document.getElementById("progressBar");
    const statusElement = document.getElementById("status");

    let availableFiles = [];
    const fileCache = new Map();

    function randomNumber(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    async function scanFiles() {
      availableFiles = [];
      let checked = 0;

      const checks = Array.from(
        { length: TOTAL_FILES },
        (_, i) => i + 1
      );

      await Promise.all(
        checks.map(async number => {
          try {
            const response = await fetch(`phrases/${number}.txt`, {
              cache: "no-store"
            });

            if (response.ok) {
              availableFiles.push(number);
            }
          } catch {
            // File does not exist or cannot be read.
          } finally {
            checked++;
            const percent = (checked / TOTAL_FILES) * 100;
            progressBar.style.width = `${percent}%`;
            statusElement.textContent = `${checked} / ${TOTAL_FILES}`;
          }
        })
      );

      availableFiles.sort((a, b) => a - b);
    }

    async function loadFile(number) {
      if (fileCache.has(number)) {
        return fileCache.get(number);
      }

      const response = await fetch(`phrases/${number}.txt`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("File not found");
      }

      const text = await response.text();

      const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

      fileCache.set(number, lines);
      return lines;
    }

    async function getRandomPhrase() {
      if (availableFiles.length === 0) {
        phraseElement.textContent = "No phrases found.";
        return;
      }

      button.disabled = true;

      // Try files until a non-empty one is found.
      const shuffled = [...availableFiles].sort(() => Math.random() - 0.5);

      for (const number of shuffled) {
        try {
          const lines = await loadFile(number);

          if (lines.length === 0) {
            continue;
          }

          phraseElement.textContent =
            lines[randomNumber(lines.length) - 1];

          button.disabled = false;
          return;
        } catch {
          continue;
        }
      }

      phraseElement.textContent = "No phrases found.";
      statusElement.textContent = "All phrase files are empty.";
      button.disabled = false;
    }

    async function initialize() {
      button.disabled = true;
      phraseElement.textContent = "Initializing...";

      await scanFiles();

      if (availableFiles.length === 0) {
        phraseElement.textContent = "No phrases found.";
        loadingLabel.textContent = "No files";
        statusElement.textContent = "Add 1.txt–99.txt to phrases";
        return;
      }

      progressBar.style.width = "100%";
      loadingLabel.textContent = "Ready";
      statusElement.textContent =
        `${availableFiles.length} file${availableFiles.length === 1 ? "" : "s"} found`;

      // Keep the loading indicator visible briefly so the transition feels intentional.
      setTimeout(() => {
        loading.classList.add("hidden");
        button.disabled = false;
        phraseElement.textContent = "Press Next";
      }, 350);
    }

    button.addEventListener("click", getRandomPhrase);
    initialize();
  </script>
</body>
</html>
