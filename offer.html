<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Random Phrase</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #15171a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(900px, 100%);
      min-height: min(700px, calc(100dvh - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 52px;
    }

    .phrase {
      width: 100%;
      max-width: 820px;
      text-align: center;
      font-size: clamp(28px, 5vw, 62px);
      line-height: 1.12;
      font-weight: 600;
      overflow-wrap: anywhere;
      padding: 24px;
    }

    .button {
      position: relative;
      min-width: 150px;
      padding: 17px 42px;
      border: 1px solid rgba(0, 70, 180, 0.35);
      border-radius: 14px;
      background: linear-gradient(
        180deg,
        #4c9cff 0%,
        #1877e8 48%,
        #0967d7 100%
      );
      color: white;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      overflow: hidden;

      box-shadow:
        0 10px 20px rgba(0, 76, 180, 0.25),
        0 3px 6px rgba(0, 0, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -2px 0 rgba(0, 50, 130, 0.18);

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        filter 0.12s ease;
      touch-action: manipulation;
    }

    /* Soft glossy highlight */
    .button::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 2px;
      height: 42%;
      border-radius: 12px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.34),
        rgba(255, 255, 255, 0)
      );
      pointer-events: none;
    }

    .button:hover {
      filter: brightness(1.06);
      box-shadow:
        0 13px 26px rgba(0, 76, 180, 0.32),
        0 4px 8px rgba(0, 0, 0, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -2px 0 rgba(0, 50, 130, 0.18);
      transform: translateY(-1px);
    }

    /* Button sinks into the page when pressed */
    .button:active {
      transform: translateY(3px) scale(0.985);
      box-shadow:
        0 3px 7px rgba(0, 76, 180, 0.22),
        0 1px 3px rgba(0, 0, 0, 0.12),
        inset 0 2px 4px rgba(0, 40, 110, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      filter: brightness(0.97);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      position: absolute;
      bottom: 12px;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      color: #7a7f87;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .app {
        min-height: calc(100dvh - 32px);
        gap: 38px;
      }

      .phrase {
        padding: 16px 4px;
        font-size: clamp(27px, 8vw, 46px);
      }

      .button {
        min-width: 132px;
        padding: 15px 34px;
        border-radius: 13px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="phrase" class="phrase">Press Next</div>

    <button id="newPhrase" class="button" type="button">
      Next
    </button>

    <div id="status" class="status"></div>
  </main>

  <script>
    const TOTAL_FILES = 99;

    const phraseElement = document.getElementById("phrase");
    const button = document.getElementById("newPhrase");
    const statusElement = document.getElementById("status");

    function randomNumber(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    async function getRandomPhrase() {
      button.disabled = true;
      statusElement.textContent = "";

      const numbers = Array.from(
        { length: TOTAL_FILES },
        (_, i) => i + 1
      ).sort(() => Math.random() - 0.5);

      for (const number of numbers) {
        try {
          const response = await fetch(`phrases/${number}.txt`, {
            cache: "no-store"
          });

          if (!response.ok) {
            continue;
          }

          const text = await response.text();

          const lines = text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0);

          if (lines.length === 0) {
            continue;
          }

          const randomLine = lines[randomNumber(lines.length) - 1];

          phraseElement.textContent = randomLine;
          button.disabled = false;
          return;
        } catch (error) {
          continue;
        }
      }

      phraseElement.textContent = "No phrases found.";
      statusElement.textContent = "Check the phrases folder.";
      button.disabled = false;
    }

    button.addEventListener("click", getRandomPhrase);
  </script>
</body>
</html>
